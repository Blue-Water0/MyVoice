[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myvoice-win"
version = "0.1.0"
description = "Privacy-first, system-wide local voice dictation for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — All rights reserved. See NOTICE.md." }
authors = [{ name = "MyVoice copyright holder" }]
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "webrtcvad>=2.0.10",
    "PySide6>=6.6",
    "comtypes>=1.2",
    "plyer>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
myvoice = "myvoice_win.app:main"

[tool.setuptools.packages.find]
include = ["myvoice_win*"]
