[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myvoice"
version = "0.1.0"
description = "Privacy-first, system-wide local voice dictation for Linux Mint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Blue-Water0" }]
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "webrtcvad>=2.0.10",
    "python-xlib>=0.33",
    "setproctitle>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
myvoice = "myvoice.app:main"

[tool.setuptools.packages.find]
include = ["myvoice*"]
exclude = ["myvoice_win*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
